name: Collect UK tenders

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Ignore the per-source schedule and read every source now"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests openpyxl

      - name: Collect
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' && '1' || '0' }}
        run: python collector.py

      - name: Commit results
        run: |
          git config user.name "tender-collector"
          git config user.email "tender-collector@users.noreply.github.com"
          git add -A data UK_Tenders.xlsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Collect $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
