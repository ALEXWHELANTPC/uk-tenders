name: Collect UK tenders

on:
  # GitHub's own timer rarely fires for this repository; the Power Automate
  # flow below is the real hourly trigger at 15 past. Keep this at 45 past so
  # that if GitHub does fire, the two never run into each other.
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Ignore the per-source schedule and read every source now"
        required: false
        default: "false"
  # Fallback timer: GitHub's own scheduler has been unreliable for this
  # repository, so a Power Automate flow ("Run tender collector hourly")
  # sends a repository dispatch event called "hourly" at 15 past each hour.
  repository_dispatch:
    types: [hourly]
  # Manual fallback: opening an issue titled "Hourly collection" also starts
  # a run, which closes the issue when it finishes.
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'issues' || github.event.issue.title == 'Hourly collection'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests openpyxl certifi cryptography

      - name: Collect
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' && '1' || '0' }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          SUPABASE_URL: https://xvzlkgdamqdharrelrde.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector.py

      - name: Commit results
        run: |
          git config user.name "tender-collector"
          git config user.email "tender-collector@users.noreply.github.com"
          git add -A data UK_Tenders.xlsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Collect $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Another run may have pushed while this one was working. Every file
            # here is regenerated from the feeds each run, so on a conflict keep
            # this run's copy and carry on; anything missed is re-read next hour.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash; then break; fi
              git checkout --theirs -- data UK_Tenders.xlsx || true
              git add -A data UK_Tenders.xlsx
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            done
            git push
          fi

      - name: Close the trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --reason completed --comment "Collection run ${{ github.run_number }} finished."
